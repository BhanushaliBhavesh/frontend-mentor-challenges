<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./style.css" />
    <title>Product preview card component</title>
  </head>
  <body>
    <div class="main-card">
      <figure class="perfume-img">
        <img alt="perfume-img" src="./images/image-product-desktop.jpg" />
      </figure>

      <div class="card-data">
        <p class="pre-heading">PERFUME</p>
        <h1 class="heading">Gabrielle Essence Eau De Parfum</h1>
        <p class="perfume-detail">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <p class="price">
          <span class="new-price">$149.99</span>
          <span class="old-price">$169.99</span>
        </p>
        <a class="btn" href="#"
          ><img
            class="cart-img"
            alt="cart photo"
            src="./images/icon-cart.svg"
          />Add to Cart</a
        >
      </div>
    </div>
  </body>
</html>
